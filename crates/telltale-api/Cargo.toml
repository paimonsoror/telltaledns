[package]
name = "telltale-api"
description = "REST API, auth, OpenAPI, live tail, and embedded UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
base64 = "0.23.1"
# The live tail's SSE stream (already in the tree via axum).
futures-util = { version = "0.3", default-features = false }
blake3 = "1.8.7"
rand = "0.10.3"
rust-embed = { version = "8.12.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
telltale-store = { version = "0.1.0", path = "../telltale-store" }
tokio = { version = "1.53.2", features = ["rt", "sync"] }
totp-rs = { version = "6.0.0", default-features = false, features = ["std"] }
utoipa = { version = "6.0.0", features = ["macros"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
