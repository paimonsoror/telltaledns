[package]
name = "telltale-api"
description = "REST API, auth, OpenAPI, live tail, and embedded UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
base64 = "0.23.1"
# The live tail's SSE stream (already in the tree via axum).
futures-util = { version = "0.3", default-features = false }
blake3 = "1.8.7"
# REQ: NFR-001 (ADR-168) — the embedded UI keeps only its `.gz` files; a client that doesn't accept
# gzip gets them inflated. Already in the tree (telltale-git, telltale-support, telltale).
miniz_oxide = "0.8"
rand = "0.10.3"
# REQ: API-004 — OIDC sign-in (02 §7). No bundled HTTP client: the binary supplies one.
openidconnect = { version = "4.0.1", default-features = false }
rust-embed = { version = "8.12.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
telltale-store = { version = "0.8.0", path = "../telltale-store" }
# REQ: OBS-017 — trace IDs (already a dependency of telltale-store).
telltale-telemetry = { version = "0.8.0", path = "../telltale-telemetry" }
tokio = { version = "1.53.2", features = ["rt", "sync"] }
tracing = "0.1"
totp-rs = { version = "6.0.0", default-features = false, features = ["std"] }
# REQ: AGT-006 (ADR-065) — MCP tools call the REST routes in-process (already in the tree via
# axum).
tower = { version = "0.5.3", default-features = false, features = ["util"] }
utoipa = { version = "6.0.0", features = ["macros"] }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# `rt-multi-thread`: the CLU-004 test runs the router on a one-worker runtime (already in the tree).
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "macros"] }
