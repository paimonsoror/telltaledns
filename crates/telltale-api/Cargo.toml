[package]
name = "telltale-api"
description = "REST API, auth, OpenAPI, live tail, and embedded UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt"] }
utoipa = { version = "6.0.0", features = ["macros"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
