[package]
name = "telltale-upstream"
description = "Upstream transports, pools, strategies, health checks, and breakers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
parking_lot = "0.12.5"
rand = "0.10.3"
telltale-config = { version = "0.1.0", path = "../telltale-config" }
telltale-proto = { version = "0.1.0", path = "../telltale-proto" }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["net", "time", "rt", "macros", "io-util", "sync"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
