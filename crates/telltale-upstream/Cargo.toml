[package]
name = "telltale-upstream"
description = "Upstream transports, pools, strategies, health checks, and breakers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# REQ: DNS-004/UPS-002 (T7.8) — DoH over HTTP/3; `02` §7 names h3 and h3-quinn.
h3 = "0.0.8"
h3-quinn = { version = "0.0.10", default-features = false }
# REQ: UPS-002 (T7.7) — DoQ upstreams (RFC 9250).
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# REQ: DNS-011 — DNSSEC validation: hickory's validating handle and primitives (`spec/03` §5).
hickory-net = { version = "0.26.3", default-features = false, features = ["dnssec-ring", "tokio"] }
tracing = "0.1.44"
bytes = "1.12.1"
h2 = "0.4.19"
http = "1.5.0"
parking_lot = "0.12.5"
rand = "0.10.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
telltale-config = { version = "0.1.0", path = "../telltale-config" }
telltale-proto = { version = "0.1.0", path = "../telltale-proto" }
# REQ: UPS-003 (T7.24) — DNSCrypt: libsodium's crypto_box (X25519 with XSalsa20- or
# XChaCha20-Poly1305) and Ed25519 certificates; ed25519-dalek is already in the tree.
crypto_box = { version = "0.9.1", features = ["chacha20"] }
ed25519-dalek = "2.2.0"
# REQ: UPS-011 (T7.16) — SHA-256 for SPKI pins (already in the tree via rustls).
ring = "0.17.14"
# REQ: UPS-012 (T7.15) — `recursive://` upstreams.
telltale-recursor = { version = "0.1.0", path = "../telltale-recursor" }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["net", "time", "rt", "macros", "io-util", "sync", "process"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1.1.6"
webpki-roots = "1.0.9"

[dev-dependencies]
# T7.8: the HTTP/3 upstream is tested against the real DoH3 listener.
telltale-net = { version = "0.1.0", path = "../telltale-net" }
rcgen = "0.14.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
