[package]
name = "telltale"
description = "TelltaleDNS — see every question, answer on your terms."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "telltale"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
arc-swap = "1.9.2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "tower-log"] }
clap = { version = "4.6.7", features = ["derive"] }
# REQ: 02 §3 — mimalloc (musl's allocator halves cache-hit throughput). no_thp: with THP on,
# mimalloc's huge pages tripled idle RSS (22 MiB vs 6 MiB), breaking the 20 MiB gate (00 §5).
mimalloc = { version = "0.1.52", default-features = false, features = ["no_thp"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
telltale-cache = { version = "0.1.0", path = "../telltale-cache" }
telltale-config.workspace = true
telltale-filter = { version = "0.1.0", path = "../telltale-filter" }
telltale-net = { version = "0.1.0", path = "../telltale-net" }
telltale-policy = { version = "0.1.0", path = "../telltale-policy" }
telltale-proto = { version = "0.1.0", path = "../telltale-proto" }
telltale-telemetry = { version = "0.1.0", path = "../telltale-telemetry" }
telltale-upstream = { version = "0.1.0", path = "../telltale-upstream" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "signal", "macros", "time"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }

[dev-dependencies]
tempfile = "3.27.0"
