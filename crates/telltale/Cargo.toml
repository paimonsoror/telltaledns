[package]
name = "telltale"
description = "TelltaleDNS — see every question, answer on your terms."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "telltale"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# REQ: OPS-008 (T7.19) — the DHCP socket (broadcast, an interface); already in the tree.
socket2 = { version = "0.6.5", features = ["all"] }
http = "1.5.0"
base64 = "0.22.1"
telltale-git = { version = "0.1.0", path = "../telltale-git" }
blake3 = "1.8.7"
arc-swap = "1.9.2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "tower-log"] }
clap = { version = "4.6.7", features = ["derive"] }
# REQ: 02 §3 — mimalloc (musl's allocator halves cache-hit throughput). no_thp: with THP on,
# mimalloc's huge pages tripled idle RSS (22 MiB vs 6 MiB), breaking the 20 MiB gate (00 §5).
mimalloc = { version = "0.1.52", default-features = false, features = ["no_thp"] }
# REQ: OPS-004 — self-update verifies minisign signatures (tiny, no dependencies).
minisign-verify = "0.2"
rand = "0.10.3"
# REQ: API-007 (T6.3) — Pi-hole keeps groups in SQLite (gravity.db) and Teleporter archives
# are zip / tar.gz. Both crates are already in the tree (telltale-store, telltale-git).
rusqlite = { version = "0.40.2", features = ["bundled"] }
miniz_oxide = "0.8"
# REQ: API-007 (T6.7) — backups are zstd-compressed tar; zstd is already in the tree
# (telltale-store, telltale-filter).
zstd = { version = "0.14.0", default-features = false }
# SHA-256 for self-update (already in the tree through rustls).
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: saved anomaly baselines reload bit-exact (OBS-013 determinism).
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
bytes = "1.12.1"
telltale-api = { version = "0.1.0", path = "../telltale-api" }
telltale-cache = { version = "0.1.0", path = "../telltale-cache" }
telltale-cluster = { version = "0.1.0", path = "../telltale-cluster" }
telltale-config.workspace = true
telltale-filter = { version = "0.1.0", path = "../telltale-filter" }
telltale-store = { version = "0.1.0", path = "../telltale-store" }
telltale-net = { version = "0.1.0", path = "../telltale-net" }
telltale-policy = { version = "0.1.0", path = "../telltale-policy" }
telltale-proto = { version = "0.1.0", path = "../telltale-proto" }
telltale-telemetry = { version = "0.1.0", path = "../telltale-telemetry" }
telltale-upstream = { version = "0.1.0", path = "../telltale-upstream" }
# io-std/io-util: `telltale mcp --stdio` (AGT-006).
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "signal", "macros", "time", "io-std", "io-util"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util"] }
