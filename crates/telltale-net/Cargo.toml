[package]
name = "telltale-net"
description = "Network listeners (UDP/TCP/DoT/DoH/DoQ). The only crate allowed unsafe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints.rust]
# REQ: NFR-003 — the one crate permitted to use unsafe (syscalls); each block needs a SAFETY comment.
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[dependencies]
# REQ: DNS-002/003 — DoT and DoH (all already in the tree via the upstream client and axum).
bytes = "1"
http-body-util = "0.1.3"
hyper = { version = "1.11.1", default-features = false, features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
libc = "0.2.190"
# REQ: DNS-004/UPS-002 (T7.8) — DoH over HTTP/3; `02` §7 names h3 and h3-quinn.
h3 = "0.0.8"
h3-quinn = { version = "0.0.10", default-features = false }
# REQ: DNS-004 (T7.7) — DoQ (RFC 9250); `02` §7 names quinn for QUIC.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1.15"
socket2 = { version = "0.6.5", features = ["all"] }
telltale-proto = { version = "0.1.0", path = "../telltale-proto" }
tokio = { version = "1.53.1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tracing = "0.1"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
# Certificate names (wildcards → client IDs from SNI).
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std", "ring"] }

[dev-dependencies]
hyper = { version = "1.11.1", default-features = false, features = ["client", "http1", "http2"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
