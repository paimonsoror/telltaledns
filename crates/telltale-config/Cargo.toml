[package]
name = "telltale-config"
description = "Configuration schema, validation, env overrides, and migrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# JSON Schema output for editor completion (`telltale config schema`, 08 §5); derive keeps schema and types in one place.
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
# Exact key paths in deserialization errors (OPS-005 AC: unknown keys error with path).
serde_path_to_error = "0.1.20"
thiserror = "2.0.21"
toml = "1.1.6"

[dev-dependencies]
serde_json = "1.0.151"
