# chart-testing (REQ: OPS-002, T4.1 AC): `ct lint --config ct.yaml`, `ct install --config ct.yaml`.
chart-dirs:
  - deploy/helm
target-branch: main
validate-maintainers: false
# Pre-1.0: the chart version moves with releases, not with every change.
check-version-increment: false
helm-extra-args: --timeout 300s