[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]
default-members = ["crates/telltale"]

[workspace.package]
version = "0.8.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/paimonsoror/telltaledns"
publish = false

[workspace.lints.rust]
# REQ: NFR-003 — unsafe is forbidden everywhere except telltale-net (which defines its own lint table).
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# AGENTS.md rule 7: no unwrap()/expect() on runtime paths (tests are allowed via clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"
todo = "warn"
dbg_macro = "deny"
print_stdout = "warn"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
telltale-config = { path = "crates/telltale-config" }

# REQ: OPS-001 / 08 §2 — release profile for the static image binary.
# Password hashing is deliberately expensive (19 MiB Argon2id); unoptimized it would make
# every auth test take seconds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# REQ: NFR-001 (ADR-170) — crates off the DNS path are built for size, not speed: the HTTP API and
# its OpenAPI, OIDC and certificate parts, cluster replication, the git source, the support
# package, and the config-file parsers (which run at startup and on a reload, not per query). About
# 0.35 MiB off the compressed image. The DNS path's functions are unchanged (a symbol comparison of
# the release binaries) and the cache-hot benchmark is within its same-binary control. Not here, on
# purpose: `telltale-config` (its client lookup is per query: about 10% less cache-hot throughput),
# and `rusqlite` and SQLite's C code (the rollup store's queries were 10 to 38% slower at -Os).
# crates/telltale-config/tests/profile.rs keeps this list off the hot path and in step with
# Cargo.lock (an entry written name@version that no longer matches is only a cargo warning).
[profile.release.package.telltale-api]
opt-level = "s"

[profile.release.package.telltale-support]
opt-level = "s"

[profile.release.package.telltale-git]
opt-level = "s"

[profile.release.package.telltale-cluster]
opt-level = "s"

[profile.release.package.openidconnect]
opt-level = "s"

[profile.release.package.oauth2]
opt-level = "s"

[profile.release.package.utoipa]
opt-level = "s"

[profile.release.package."schemars@0.9.0"]
opt-level = "s"

[profile.release.package."schemars@1.2.3"]
opt-level = "s"

[profile.release.package.clap_builder]
opt-level = "s"

[profile.release.package.toml]
opt-level = "s"

[profile.release.package.toml_parser]
opt-level = "s"

[profile.release.package.toml_writer]
opt-level = "s"

[profile.release.package.serde_path_to_error]
opt-level = "s"

[profile.release.package.x509-parser]
opt-level = "s"

[profile.release.package.asn1-rs]
opt-level = "s"

[profile.release.package.der-parser]
opt-level = "s"

[profile.release.package.rcgen]
opt-level = "s"

[profile.release.package.yasna]
opt-level = "s"

[profile.release.package.totp-rs]
opt-level = "s"

[profile.release.package.minisign-verify]
opt-level = "s"

[profile.release.package.url]
opt-level = "s"

[profile.release.package.chrono]
opt-level = "s"

[profile.release.package.rsa]
opt-level = "s"

[profile.release.package.num-bigint-dig]
opt-level = "s"

# Fast local benchmarking builds without fat LTO.
[profile.bench-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
