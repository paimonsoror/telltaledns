[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]
default-members = ["crates/telltale"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/paimonsoror/telltaledns"
publish = false

[workspace.lints.rust]
# REQ: NFR-003 — unsafe is forbidden everywhere except telltale-net (which defines its own lint table).
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# AGENTS.md rule 7: no unwrap()/expect() on runtime paths (tests are allowed via clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"
todo = "warn"
dbg_macro = "deny"
print_stdout = "warn"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
telltale-config = { path = "crates/telltale-config" }

# REQ: OPS-001 / 08 §2 — release profile for the static image binary.
# Password hashing is deliberately expensive (19 MiB Argon2id); unoptimized it would make
# every auth test take seconds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Fast local benchmarking builds without fat LTO.
[profile.bench-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
