[package]
name = "telltale-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Standalone workspace: built with nightly via `cargo +nightly fuzz run <target>` (NFR-004).
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
telltale-proto = { path = "../crates/telltale-proto" }
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }

[[bin]]
name = "parse_query"
path = "fuzz_targets/parse_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_response"
path = "fuzz_targets/parse_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
