[package]
name = "telltale-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Standalone workspace: built with nightly via `cargo +nightly fuzz run <target>` (NFR-004).
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
telltale-proto = { path = "../crates/telltale-proto" }
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
telltale-cache = { path = "../crates/telltale-cache" }
telltale-config = { path = "../crates/telltale-config" }
telltale-filter = { path = "../crates/telltale-filter" }
regex-syntax = "0.8"
telltale-store = { path = "../crates/telltale-store" }
telltale-telemetry = { path = "../crates/telltale-telemetry" }

[[bin]]
name = "parse_query"
path = "fuzz_targets/parse_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_response"
path = "fuzz_targets/parse_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cache_response"
path = "fuzz_targets/cache_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_list"
path = "fuzz_targets/parse_list.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qlog_segment"
path = "fuzz_targets/qlog_segment.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
