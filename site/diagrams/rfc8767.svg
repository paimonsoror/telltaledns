<svg viewBox="0 0 320 150" role="img" width="320"><title>Fresh, then a stale window where expired data is served if upstreams fail</title>
<path d="M10 70 H310" class="svg-ink"/>
<rect x="10" y="56" width="110" height="28" rx="5" class="svg-ok" opacity=".75"/><text x="65" y="74" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">fresh (TTL)</text>
<rect x="122" y="56" width="188" height="28" rx="5" class="svg-warn" opacity=".55"/><text x="216" y="74" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">stale window (1 day)</text>
<text x="10" y="108" class="svg-sub">Upstreams silent for 1.8 s → stale answer,</text>
<text x="10" y="126" class="svg-sub">TTL 30, EDE 3; the refresh keeps going.</text>
</svg>
