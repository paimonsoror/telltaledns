<svg viewBox="0 0 320 150" role="img" width="320"><title>DNS64: no AAAA for the name, so its A record becomes an AAAA inside the NAT64 prefix</title>
<rect x="20" y="14" width="280" height="30" rx="6" class="svg-box"/><text x="160" y="34" text-anchor="middle" class="svg-sub">AAAA github.com? → no data</text>
<rect x="20" y="50" width="280" height="30" rx="6" class="svg-box"/><text x="160" y="70" text-anchor="middle" class="svg-sub">A github.com → 140.82.112.4</text>
<rect x="20" y="86" width="280" height="30" rx="6" class="svg-ok" opacity=".75"/><text x="160" y="106" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">AAAA 64:ff9b::8c52:7004</text>
<text x="160" y="138" text-anchor="middle" class="svg-sub">per group · NAT64 prefix /96 · not for CD clients</text>
</svg>
