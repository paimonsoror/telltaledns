<svg viewBox="0 0 320 150" role="img" width="320"><title>The OPT pseudo-record carries payload size, version, DO bit and options</title>
<text x="10" y="18" class="svg-sub">OPT record (in Additional)</text>
<rect x="10" y="26" width="40" height="34" rx="5" class="svg-box"/><text x="30" y="47" text-anchor="middle" class="svg-mono">.</text>
<rect x="52" y="26" width="50" height="34" rx="5" class="svg-box"/><text x="77" y="47" text-anchor="middle" class="svg-mono">41</text>
<rect x="104" y="26" width="80" height="34" rx="5" class="svg-ok" opacity=".8"/><text x="144" y="47" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">1232 B</text>
<rect x="186" y="26" width="70" height="34" rx="5" class="svg-box"/><text x="221" y="47" text-anchor="middle" class="svg-sub">v0 · DO</text>
<rect x="258" y="26" width="52" height="34" rx="5" class="svg-accent" opacity=".8"/><text x="284" y="47" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">opts</text>
<text x="30" y="76" text-anchor="middle" class="svg-sub">root</text><text x="77" y="76" text-anchor="middle" class="svg-sub">type</text><text x="144" y="76" text-anchor="middle" class="svg-sub">UDP size</text><text x="221" y="76" text-anchor="middle" class="svg-sub">ext · flags</text><text x="284" y="76" text-anchor="middle" class="svg-sub">EDE…</text>
<text x="10" y="108" class="svg-sub">• No OPT from the client → none in our reply.</text>
<text x="10" y="128" class="svg-sub">• Version ≠ 0 → BADVERS (extended RCODE 16).</text>
</svg>
