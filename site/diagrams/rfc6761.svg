<svg viewBox="0 0 320 150" role="img" width="320"><title>Reserved names are answered locally and never sent upstream</title>
<rect x="10" y="12" width="120" height="30" rx="8" class="svg-box"/><text x="70" y="32" text-anchor="middle" class="svg-mono">localhost</text>
<path d="M130 27 H160" class="svg-stroke-brand" stroke-width="2"/>
<rect x="160" y="12" width="150" height="30" rx="8" class="svg-ok" opacity=".8"/><text x="235" y="32" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">127.0.0.1 / ::1</text>
<rect x="10" y="52" width="120" height="30" rx="8" class="svg-box"/><text x="70" y="72" text-anchor="middle" class="svg-mono">x.invalid</text>
<path d="M130 67 H160" class="svg-stroke-brand" stroke-width="2"/>
<rect x="160" y="52" width="150" height="30" rx="8" class="svg-box"/><text x="235" y="72" text-anchor="middle" class="svg-sub">NXDOMAIN</text>
<rect x="10" y="92" width="120" height="30" rx="8" class="svg-box"/><text x="70" y="112" text-anchor="middle" class="svg-mono">5.1.168.192…</text>
<path d="M130 107 H160" class="svg-stroke-brand" stroke-width="2"/>
<rect x="160" y="92" width="150" height="30" rx="8" class="svg-box"/><text x="235" y="112" text-anchor="middle" class="svg-sub">local data, else NXDOMAIN</text>
<text x="160" y="142" text-anchor="middle" class="svg-sub">none of these leave your network</text>
</svg>
