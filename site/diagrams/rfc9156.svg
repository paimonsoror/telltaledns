<svg viewBox="0 0 320 150" role="img" width="320"><title>QNAME minimization: the root sees com, com sees example.com, example.com's servers see www.example.com</title>
<rect x="20" y="14" width="280" height="30" rx="6" class="svg-box"/><text x="160" y="34" text-anchor="middle" class="svg-sub">root  ←  A com?</text>
<rect x="20" y="50" width="280" height="30" rx="6" class="svg-box"/><text x="160" y="70" text-anchor="middle" class="svg-sub">com  ←  A example.com?</text>
<rect x="20" y="86" width="280" height="30" rx="6" class="svg-ok" opacity=".75"/><text x="160" y="106" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">example.com  ←  A www.example.com?</text>
<text x="160" y="138" text-anchor="middle" class="svg-sub">recursive:// upstream ✓ · relaxed fallback</text>
</svg>
