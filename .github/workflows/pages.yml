# REQ: DOC-001, DOC-005 — build, check, and deploy the project site (ADR-012).
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# If the source is "Deploy from a branch", GitHub also runs its own "pages build and deployment"
# (Jekyll over the README) on every push, and whichever deploy finishes last is what's live:
# the site then turns into a plain README page after commits that don't touch site/.
name: pages
on:
  push:
    branches: [main]
    # T6.10: the "For nerds" page reads the crates (arrows, line counts, types) and the specs
    # (ADRs, requirements, budgets), so changes there redeploy it too.
    paths: ["site/**", "docs/config-schema.json", "docs/help/**", "deploy/helm/telltale/values.yaml", "deploy/helm/telltale/values.schema.json", "spec/**", "crates/**", "Cargo.toml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build site (injects partials, renders standards, checks coverage + links)
        run: python3 site/build.py
      # T9.23 — the newest nightly coverage report at /coverage/ (a placeholder until one exists).
      - name: Coverage report from the nightly workflow
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p site/_site/coverage
          for id in $(gh run list -R "$GITHUB_REPOSITORY" -w nightly --limit 10 --json databaseId -q '.[].databaseId'); do
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n coverage -D site/_site/coverage 2>/dev/null; then
              echo "coverage from nightly run $id"; break
            fi
          done
          if [ ! -f site/_site/coverage/index.html ]; then
            printf '<!doctype html><meta charset="utf-8"><title>Test coverage</title><p>No coverage report yet: the nightly workflow makes one.</p>\n' > site/_site/coverage/index.html
          fi
      - name: Lighthouse (all categories >= 0.9)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: site/lighthouserc.json
          uploadArtifacts: true
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/_site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
