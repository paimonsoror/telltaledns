# REQ: DOC-001, DOC-005 — build, check, and deploy the project site (ADR-012).
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# If the source is "Deploy from a branch", GitHub also runs its own "pages build and deployment"
# (Jekyll over the README) on every push, and whichever deploy finishes last is what's live:
# the site then turns into a plain README page after commits that don't touch site/.
name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "spec/10-roadmap-and-tasks.md", "spec/01-requirements.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build site (injects partials, renders standards, checks coverage + links)
        run: python3 site/build.py
      - name: Lighthouse (all categories >= 0.9)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: site/lighthouserc.json
          uploadArtifacts: true
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/_site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
