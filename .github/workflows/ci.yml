# REQ: 09 §4 — fmt → clippy → test → cargo-deny (image, integration, and bench stages are added by later tasks).
name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with: { components: rustfmt }
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee "$RUNNER_TEMP/test.log"
      # Job logs need a token to read; annotations don't. Surface failing tests there.
      - name: Annotate failing tests
        if: failure()
        shell: bash
        run: |
          grep -E "panicked at|^test .* \.\.\. FAILED|^    [a-z0-9_]+(::[a-z0-9_]+)+$" "$RUNNER_TEMP/test.log" \
            | head -20 | while IFS= read -r line; do echo "::error title=test failure::$line"; done

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # REQ: NFR-001 — the harness runs end to end. Hosted runners are too noisy for the 5%
  # regression gate (09 §2 needs a fixed machine), so this fails only on loss or errors.
  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y dnsperf
      - run: make bench-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-smoke
          path: bench/results/*.json
          if-no-files-found: ignore

  # REQ: DOC-004/005 — the site builds, links resolve, and Standards covers ticked tasks.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 site/build.py --check
      # REQ: OBS-005 — the Grafana dashboard is regenerated from deploy/grafana/build.py.
      - run: python3 deploy/grafana/build.py --check

  # REQ: API-005 — T3.9 AC: the UI type-checks, its API types match docs/api/openapi.json,
  # the bundle stays within 400 KiB gzipped, and the Playwright suite passes against the
  # real binary.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: API types match the OpenAPI document
        run: npm run types && git diff --exit-code src/lib/api-types.ts
      - run: npm run check
      - name: Build (fails over the size budget)
        run: npm run build
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p telltale
        working-directory: .
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report
          if-no-files-found: ignore

  # REQ: API-004 — T3.6 AC: sign in through real Keycloak and Authentik (ui/tests/oidc/).
  oidc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - name: Start Keycloak and Authentik
        run: docker compose -f tests/oidc/compose.yml up -d --wait --wait-timeout 300
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p telltale
        working-directory: .
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Wait for Authentik to apply its blueprint
        run: |
          for i in $(seq 60); do
            curl -sf -o /dev/null http://127.0.0.1:9000/application/o/telltale/.well-known/openid-configuration && exit 0
            sleep 5
          done
          exit 1
      - run: npm run test:e2e
        env:
          OIDC_E2E: keycloak,authentik
      - name: Provider logs
        if: failure()
        run: docker compose -f tests/oidc/compose.yml logs --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-oidc
          path: ui/playwright-report
          if-no-files-found: ignore

  # REQ: OPS-002, OPS-003 — T4.1 AC: chart-testing lint and install on kind (amd64) and k3d
  # (arm64), plus DNS through a LoadBalancer with the client's address in the query log.
  helm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, tool: kind }
          - { runner: ubuntu-24.04-arm, tool: k3d }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: azure/setup-helm@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: helm/chart-testing-action@v2.7.0
      - run: ct lint --config ct.yaml --all
      - name: Install kind
        if: matrix.tool == 'kind'
        uses: helm/kind-action@v1
        with: { install_only: true }
      - name: Install k3d
        if: matrix.tool == 'k3d'
        run: curl -sSfL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash
      - run: sudo apt-get update && sudo apt-get install -y dnsutils
      - name: DNS through a LoadBalancer; client IP in the query log
        run: KEEP=1 E2E_KUBECONFIG="$RUNNER_TEMP/kubeconfig" TOOL=${{ matrix.tool }} bash deploy/helm/e2e.sh
      - name: ct install (every ci/*-values.yaml)
        run: KUBECONFIG="$RUNNER_TEMP/kubeconfig" ct install --config ct.yaml --all
