# REQ: 09 §4 — fmt → clippy → test → cargo-deny (image, integration, and bench stages are added by later tasks).
name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with: { components: rustfmt }
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # REQ: NFR-001 — the harness runs end to end. Hosted runners are too noisy for the 5%
  # regression gate (09 §2 needs a fixed machine), so this fails only on loss or errors.
  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y dnsperf
      - run: make bench-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-smoke
          path: bench/results/*.json
          if-no-files-found: ignore

  # REQ: DOC-004/005 — the site builds, links resolve, and Standards covers ticked tasks.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 site/build.py --check
      # REQ: OBS-005 — the Grafana dashboard is regenerated from deploy/grafana/build.py.
      - run: python3 deploy/grafana/build.py --check

  # REQ: API-005 — T3.9 AC: the UI type-checks, its API types match docs/api/openapi.json,
  # the bundle stays within 400 KiB gzipped, and the Playwright suite passes against the
  # real binary.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: API types match the OpenAPI document
        run: npm run types && git diff --exit-code src/lib/api-types.ts
      - run: npm run check
      - name: Build (fails over the size budget)
        run: npm run build
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p telltale
        working-directory: .
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report
          if-no-files-found: ignore
