# REQ: OPS-001 / T0.4 — multi-arch FROM-scratch image, size gate, QEMU smoke, `edge` on main.
# REQ: OPS-004 / T4.3 — the same build's static binaries, signed, as GitHub release assets:
# the `edge` prerelease follows main; a `v*` tag publishes a release and versioned image tags.
name: image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/telltale
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      build_version: ${{ steps.v.outputs.build_version }}
      build_commit: ${{ steps.v.outputs.build_commit }}
      build_date: ${{ steps.v.outputs.build_date }}
      build_channel: ${{ steps.v.outputs.build_channel }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else echo "version=edge" >> "$GITHUB_OUTPUT"; fi
          # REQ: OPS-004 (ADR-046) — one build identity for every architecture of this commit.
          pkg=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then bv="${GITHUB_REF_NAME#v}"; ch=stable
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then bv="${pkg}-edge.${GITHUB_RUN_NUMBER}"; ch=edge
          else bv="${pkg}-pr.${GITHUB_RUN_NUMBER}"; ch=dev; fi
          date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "build_version=$bv"; echo "build_channel=$ch"; echo "build_date=$date"
            echo "build_commit=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"
          echo "BUILD_ARGS=--build-arg TELLTALE_BUILD_VERSION=$bv --build-arg TELLTALE_BUILD_COMMIT=${GITHUB_SHA::7} --build-arg TELLTALE_BUILD_DATE=$date --build-arg TELLTALE_BUILD_CHANNEL=$ch" >> "$GITHUB_ENV"

      - name: Build all platforms (OCI layout)
        run: |
          docker buildx build $BUILD_ARGS --platform "$PLATFORMS" \
            --build-arg VERSION=${{ steps.v.outputs.version }} --build-arg REVISION="$GITHUB_SHA" \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --output type=oci,dest=image.tar .

      - name: Size gate (≤ 15 MiB compressed per arch)
        run: python3 deploy/image/size.py --oci image.tar

      # The build stage is cross-compiled, so these loads come from cache; only running the
      # arm images uses QEMU (T0.4 AC: runs on arm64 under QEMU).
      - name: Smoke test each platform
        run: |
          sudo apt-get update && sudo apt-get install -y dnsutils
          for p in ${PLATFORMS//,/ }; do
            tag="telltale:smoke-${p//\//-}"
            docker buildx build $BUILD_ARGS --platform "$p" --cache-from type=gha --load -t "$tag" .
            deploy/image/smoke.sh "$tag" "$p"
          done

      - name: Release binaries (from the same cached build)
        run: |
          docker buildx build $BUILD_ARGS --platform "$PLATFORMS" --target bin --cache-from type=gha \
            --output type=local,dest=bin .
          mkdir dist
          cp bin/linux_amd64/telltale dist/telltale-x86_64-linux
          cp bin/linux_arm64/telltale dist/telltale-aarch64-linux
          cp bin/linux_arm_v7/telltale dist/telltale-armv7-linux
          chmod 755 dist/*
          dist/telltale-x86_64-linux --version
          # T6.9 AC: every architecture reports the same version and commit.
          line="${{ steps.v.outputs.build_version }} (commit ${{ steps.v.outputs.build_commit }}"
          for f in dist/telltale-*; do
            grep -aqF "$line" "$f" || { echo "::error::$f doesn't carry '$line'"; exit 1; }
          done
          (cd dist && sha256sum telltale-* > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
          retention-days: 7

      - name: Push edge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx build $BUILD_ARGS --platform "$PLATFORMS" \
            --build-arg VERSION=edge --build-arg REVISION="$GITHUB_SHA" \
            --cache-from type=gha \
            -t "$IMAGE:edge" -t "$IMAGE:sha-${GITHUB_SHA::7}" --push .
          python3 deploy/image/size.py --remote "$IMAGE:edge"

      - name: Push release tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${{ steps.v.outputs.version }}"
          tags=(-t "$IMAGE:$v")
          if [[ "$v" != *-* ]]; then   # no pre-release suffix: also X.Y, X, and latest
            tags+=(-t "$IMAGE:${v%.*}" -t "$IMAGE:${v%%.*}" -t "$IMAGE:latest")
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx build $BUILD_ARGS --platform "$PLATFORMS" \
            --build-arg VERSION="$v" --build-arg REVISION="$GITHUB_SHA" \
            --cache-from type=gha "${tags[@]}" --push .

  # REQ: OPS-002 — the Helm chart as an OCI artifact, so others install it without cloning:
  # `helm install telltale oci://ghcr.io/<owner>/charts/telltale --version <v>`. Main
  # publishes `<chart version>-edge.<run>` (appVersion edge); a `v*` tag publishes that version.
  chart:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package and push
        run: |
          base=$(awk '/^version:/ {print $2}' deploy/helm/telltale/Chart.yaml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; app="$v"
          else v="${base}-edge.${GITHUB_RUN_NUMBER}"; app=edge; fi
          helm package deploy/helm/telltale --version "$v" --app-version "$app" -d out
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "out/telltale-$v.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
          echo "::notice title=chart published::oci://ghcr.io/${{ github.repository_owner }}/charts/telltale --version $v"

  # Signs SHA256SUMS with the release key (secret MINISIGN_SECRET_KEY; public half in
  # deploy/release/telltale-release.pub and built into `telltale self-update`) and publishes.
  release:
    needs: image
    if: github.event_name == 'push'
    # Two pushes in a row replaced `edge` at once, and one got a 403; the newer one wins.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - name: Sign
        id: sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::warning title=release not published::Add the MINISIGN_SECRET_KEY repository secret to publish signed binaries (install.sh and self-update refuse unsigned ones)."
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          # REQ: OPS-004 (ADR-046) — the release index nodes check for updates.
          python3 deploy/release/index.py dist "${{ needs.image.outputs.build_channel }}" \
            "${{ needs.image.outputs.build_version }}" "${{ needs.image.outputs.build_commit }}" \
            "${{ needs.image.outputs.build_date }}" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/${GITHUB_REF_NAME/main/edge}" \
            > dist/releases.json
          cat dist/releases.json
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/release.key"
          for f in SHA256SUMS releases.json; do
            minisign -S -s "$RUNNER_TEMP/release.key" -m "dist/$f" \
              -t "telltale ${GITHUB_REF_NAME} ${GITHUB_SHA}"
          done
          rm "$RUNNER_TEMP/release.key"
          minisign -V -p deploy/release/telltale-release.pub -m dist/SHA256SUMS
          minisign -V -p deploy/release/telltale-release.pub -m dist/releases.json
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Publish edge prerelease
        if: steps.sign.outputs.signed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A newer push publishes its own edge; racing it only produced 403s (twice on
          # 2026-10-04/05), so a superseded run steps aside.
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::notice title=edge not published::main moved on to ${latest::7}; its run publishes edge"
            exit 0
          fi
          gh release delete edge --yes --cleanup-tag 2>/dev/null || true
          gh release create edge dist/* --prerelease --target "$GITHUB_SHA" \
            --title "edge (main @ ${GITHUB_SHA::7})" \
            --notes "Built from main at ${GITHUB_SHA}. Not a stable release: install with \`install.sh --edge\` or \`telltale self-update --channel edge\`."
      - name: Publish release
        if: steps.sign.outputs.signed == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes $pre \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
