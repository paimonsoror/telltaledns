# TelltaleDNS device signatures (REQ: OBS-025, ADR-117).
#
# Clean room: written from vendors' public documentation (firewall allowlists, support pages)
# and our own observations; no fingerprint database from another project is used. Each
# signature says what a kind of device looks like to a DNS server:
#   vendors            words matched against the MAC vendor (whole words, any case)
#   vendor_required    the vendor must match for the signature to count at all
#   hostname_patterns  globs (* and ?) matched against the names it announces (DHCP, mDNS)
#   domains            registrable domains it talks to, with weights relative to each other
# Score = 0.60 x matched domain weight / total + 0.25 x vendor + 0.15 x name; a known vendor
# that doesn't match halves it. `likely` from 0.60, `possibly` from 0.35.
# Classes: phone tablet laptop desktop tv streaming speaker console camera doorbell plug bulb
# thermostat hub vacuum printer nas network appliance wearable car other.
# Add or replace signatures locally with `[identify] signatures_file` (same shape).

# --- Apple: the domains are shared; the name a device announces tells them apart.
[[device]]
id = "apple-appletv"
name = "Apple TV"
class = "streaming"
vendors = ["Apple"]
hostname_patterns = ["*Apple-TV*", "AppleTV*", "*Apple TV*"]
domains = [
  { name = "apple.com", weight = 0.4 },
  { name = "icloud.com", weight = 0.3 },
  { name = "mzstatic.com", weight = 0.3 },
]

