# TelltaleDNS upstream preset catalog (REQ: UPS-004, spec/04 §3).
#
# Data, not code: compiled into the binary and expanded into explicit [[upstream]] entries by
# `telltale presets show <id>` (and later the UI), so a running config never depends on this file.
#
# Fields:
#   id, name, homepage   identity
#   sources              which incumbent offers it as a preset ("pihole", "technitium")
#   filtering            none | malware | family | ads
#   dnssec, ecs          whether the service validates DNSSEC / forwards EDNS Client Subnet
#   params               placeholders used in URLs as {name} (e.g. a NextDNS profile ID)
#   [[preset.endpoint]]  url (+ tls_server_name for IP-literal TLS endpoints)
#
# Addresses come from each provider's public documentation. The nightly online smoke test
# (crates/telltale-upstream/tests/presets_online.rs) resolves example.com through every entry.

# ---------------------------------------------------------------- Pi-hole presets (all of them)

[[preset]]
id = "google"
name = "Google"
homepage = "https://developers.google.com/speed/public-dns"
sources = ["pihole", "technitium"]
filtering = "none"
dnssec = true
ecs = true
endpoint = [
  { url = "udp://8.8.8.8" },
  { url = "udp://8.8.4.4" },
  { url = "udp://[2001:4860:4860::8888]" },
  { url = "udp://[2001:4860:4860::8844]" },
  { url = "tls://8.8.8.8", tls_server_name = "dns.google" },
  { url = "tls://8.8.4.4", tls_server_name = "dns.google" },
  { url = "https://dns.google/dns-query" },
]

