# Generated by deploy/prometheus/build.sh from the Helm chart (prometheusRule.slo). Do not edit.
# TelltaleDNS service-level objectives (OBS-016): availability 99.9% (answers that aren't
# SERVFAIL), latency 99% within 250 ms, as in the default [slo] section. Load it with
# rule_files in prometheus.yml; the scrape job must be named telltale-metrics.
groups:
- name: telltale-slo
  rules:
  - record: telltale:slo_availability_errors:ratio_rate5m
    expr: sum(rate(telltale_responses_total{job="telltale-metrics",rcode="SERVFAIL"}[5m])) / sum(rate(telltale_responses_total{job="telltale-metrics"}[5m]))
  - record: telltale:slo_latency_errors:ratio_rate5m
    expr: 1 - sum(rate(telltale_query_duration_seconds_bucket{job="telltale-metrics",le="0.25"}[5m])) / sum(rate(telltale_query_duration_seconds_count{job="telltale-metrics"}[5m]))
  - record: telltale:slo_availability_errors:ratio_rate30m
    expr: sum(rate(telltale_responses_total{job="telltale-metrics",rcode="SERVFAIL"}[30m])) / sum(rate(telltale_responses_total{job="telltale-metrics"}[30m]))
  - record: telltale:slo_latency_errors:ratio_rate30m
    expr: 1 - sum(rate(telltale_query_duration_seconds_bucket{job="telltale-metrics",le="0.25"}[30m])) / sum(rate(telltale_query_duration_seconds_count{job="telltale-metrics"}[30m]))
  - record: telltale:slo_availability_errors:ratio_rate1h
    expr: sum(rate(telltale_responses_total{job="telltale-metrics",rcode="SERVFAIL"}[1h])) / sum(rate(telltale_responses_total{job="telltale-metrics"}[1h]))
  - record: telltale:slo_latency_errors:ratio_rate1h
    expr: 1 - sum(rate(telltale_query_duration_seconds_bucket{job="telltale-metrics",le="0.25"}[1h])) / sum(rate(telltale_query_duration_seconds_count{job="telltale-metrics"}[1h]))
  - record: telltale:slo_availability_errors:ratio_rate6h
    expr: sum(rate(telltale_responses_total{job="telltale-metrics",rcode="SERVFAIL"}[6h])) / sum(rate(telltale_responses_total{job="telltale-metrics"}[6h]))
  - record: telltale:slo_latency_errors:ratio_rate6h
    expr: 1 - sum(rate(telltale_query_duration_seconds_bucket{job="telltale-metrics",le="0.25"}[6h])) / sum(rate(telltale_query_duration_seconds_count{job="telltale-metrics"}[6h]))
  - record: telltale:slo_availability_errors:ratio_rate3d
    expr: sum(rate(telltale_responses_total{job="telltale-metrics",rcode="SERVFAIL"}[3d])) / sum(rate(telltale_responses_total{job="telltale-metrics"}[3d]))
  - record: telltale:slo_latency_errors:ratio_rate3d
    expr: 1 - sum(rate(telltale_query_duration_seconds_bucket{job="telltale-metrics",le="0.25"}[3d])) / sum(rate(telltale_query_duration_seconds_count{job="telltale-metrics"}[3d]))
  - alert: TelltaleDNSSLOAvailabilityBurnFast
    expr: |
      telltale:slo_availability_errors:ratio_rate1h > (14.4 * (1 - 0.999))
      and telltale:slo_availability_errors:ratio_rate5m > (14.4 * (1 - 0.999))
      and on() sum(increase(telltale_responses_total{job="telltale-metrics"}[5m])) >= 50
      and on() sum(increase(telltale_responses_total{job="telltale-metrics",rcode="SERVFAIL"}[1h])) >= 10
    labels:
      severity: critical
      slo: availability
    annotations:
      summary: The availability objective (99.9%) is spending its error budget over 14.4x too fast (SERVFAIL answers over the last 1h and 5m); see the dashboard's Service level card.
  - alert: TelltaleDNSSLOAvailabilityBurnSlow
    expr: |
      telltale:slo_availability_errors:ratio_rate6h > (6 * (1 - 0.999))
      and telltale:slo_availability_errors:ratio_rate30m > (6 * (1 - 0.999))
      and on() sum(increase(telltale_responses_total{job="telltale-metrics"}[30m])) >= 50
      and on() sum(increase(telltale_responses_total{job="telltale-metrics",rcode="SERVFAIL"}[6h])) >= 10
    labels:
      severity: critical
      slo: availability
    annotations:
      summary: The availability objective (99.9%) is spending its error budget over 6x too fast (SERVFAIL answers over the last 6h and 30m); see the dashboard's Service level card.
  - alert: TelltaleDNSSLOAvailabilityBurnTicket
    expr: |
      telltale:slo_availability_errors:ratio_rate3d > (1 * (1 - 0.999))
      and telltale:slo_availability_errors:ratio_rate6h > (1 * (1 - 0.999))
      and on() sum(increase(telltale_responses_total{job="telltale-metrics"}[6h])) >= 50
      and on() sum(increase(telltale_responses_total{job="telltale-metrics",rcode="SERVFAIL"}[3d])) >= 10
    labels:
      severity: warning
      slo: availability
    annotations:
      summary: The availability objective (99.9%) is spending its error budget over 1x too fast (SERVFAIL answers over the last 3d and 6h); see the dashboard's Service level card.
  - alert: TelltaleDNSSLOLatencyBurnFast
    expr: |
      telltale:slo_latency_errors:ratio_rate1h > (14.4 * (1 - 0.99))
      and telltale:slo_latency_errors:ratio_rate5m > (14.4 * (1 - 0.99))
      and on() sum(increase(telltale_query_duration_seconds_count{job="telltale-metrics"}[5m])) >= 50
      and on() (sum(increase(telltale_query_duration_seconds_count{job="telltale-metrics"}[1h])) - sum(increase(telltale_query_duration_seconds_bucket{job="telltale-metrics",le="0.25"}[1h]))) >= 10
    labels:
      severity: critical
      slo: latency
    annotations:
      summary: The latency objective (99%) is spending its error budget over 14.4x too fast (answers slower than 250 ms over the last 1h and 5m); see the dashboard's Service level card.
  - alert: TelltaleDNSSLOLatencyBurnSlow
    expr: |
      telltale:slo_latency_errors:ratio_rate6h > (6 * (1 - 0.99))
      and telltale:slo_latency_errors:ratio_rate30m > (6 * (1 - 0.99))
      and on() sum(increase(telltale_query_duration_seconds_count{job="telltale-metrics"}[30m])) >= 50
      and on() (sum(increase(telltale_query_duration_seconds_count{job="telltale-metrics"}[6h])) - sum(increase(telltale_query_duration_seconds_bucket{job="telltale-metrics",le="0.25"}[6h]))) >= 10
    labels:
      severity: critical
      slo: latency
    annotations:
      summary: The latency objective (99%) is spending its error budget over 6x too fast (answers slower than 250 ms over the last 6h and 30m); see the dashboard's Service level card.
  - alert: TelltaleDNSSLOLatencyBurnTicket
    expr: |
      telltale:slo_latency_errors:ratio_rate3d > (1 * (1 - 0.99))
      and telltale:slo_latency_errors:ratio_rate6h > (1 * (1 - 0.99))
      and on() sum(increase(telltale_query_duration_seconds_count{job="telltale-metrics"}[6h])) >= 50
      and on() (sum(increase(telltale_query_duration_seconds_count{job="telltale-metrics"}[3d])) - sum(increase(telltale_query_duration_seconds_bucket{job="telltale-metrics",le="0.25"}[3d]))) >= 10
    labels:
      severity: warning
      slo: latency
    annotations:
      summary: The latency objective (99%) is spending its error budget over 1x too fast (answers slower than 250 ms over the last 3d and 6h); see the dashboard's Service level card.
