# TelltaleDNS Helm chart (REQ: OPS-002, OPS-003, spec/08 §3, ADR-035).

# Shape.
# - `allInOne`: one StatefulSet (resolver, API, UI, query log).
# - `scaled` (CLU-009): that StatefulSet becomes the cluster's controller (primary, with the
#   volume), plus `resolvers.replicas` resolver pods. The pods join the controller
#   automatically with a generated Secret, take its configuration and lists, ship their query
#   log to it, and come and go freely (ephemeral members). DNS is spread over every pod; the
#   UI and API stay on the controller. A node outside Kubernetes (a Pi) can join too: see
#   `cluster.advertise`.
# - `daemonSet` (host-network resolvers) comes later.
mode: allInOne

# REQ: CLU-009 — clustering (mode: scaled).
cluster:
  # Site label for these pods (the Cluster page groups resolver pods by site).
  site: k8s
  # The cluster port inside the pods (mTLS between nodes).
  port: 9443
  service:
    # ClusterIP for pods only. LoadBalancer (or NodePort) lets a node outside Kubernetes join.
    type: ClusterIP
    annotations: {}
  # Extra URLs for the controller's cluster port that nodes outside Kubernetes dial, e.g.
  # ["https://192.168.5.100:9443"] behind a LoadBalancer. In-cluster URLs are added for you.
  advertise: []
  # The shared join secret. Empty: the chart creates one (kept across upgrades). With Argo CD
  # (no `lookup`), create the Secret yourself and name it here.
  bootstrapSecret:
    # A Secret of your own instead of the generated one (48 random characters). Use at
    # least 32 random characters: anyone who knows it can join as a resolver pod.
    existingSecret: ""
    key: bootstrap
  # REQ: CLU-013 — staged rollouts (mode: scaled): a configuration change reaches the canary
  # nodes (and the controller, which runs it at once) first, and every other node after
  # `bakeSeconds` if nothing fails; a failure pins the cluster to the version before. Empty
  # (the default): changes reach every node at once. Entries are node IDs, `site:<name>`, or
  # `ephemeral` (the resolver pods). With `[ephemeral]`, the pods take a change at once under
  # the guard's watch and nodes outside Kubernetes (a Raspberry Pi that joined) wait out the
  # bake. Also editable in the web UI: Settings → Cluster → Staged rollouts.
  rollout:
    canaries: []
    # How long a change bakes on the canaries before everyone gets it (at least 5).
    bakeSeconds: 300
    # Fail when the canaries' SERVFAIL share during the bake is over max(the share before + 2
    # points, this) percent (with at least 50 answers).
    servfailPct: 5
    # Keep baking until the canaries answered 50 queries (or an hour), then judge.
    requireTraffic: false
    # Versions kept for pinning back to (their files stay on the controller's volume).
    history: 20

resolvers:
  replicas: 2
  # Seconds the controller keeps a resolver pod it no longer hears from.
  ephemeralTtlSeconds: 600
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  # e.g. spread the pods: podAntiAffinity on app.kubernetes.io/component: resolver
  affinity: {}

image:
  repository: ghcr.io/paimonsoror/telltale
  # Default: the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Extra telltale.toml, merged after the settings the chart controls (listeners, data_dir,
# metrics and API addresses). See docs/configuration.md.
config: |
  [node]
  # workers = 0  # auto: CPU limit or cores

# Bind DNS on the node's network directly (port 53): real client IPs and MAC addresses, no
# NAT, no LoadBalancer needed. Binding 53 on the host needs root with only NET_BIND_SERVICE
# (all other capabilities dropped). On k3s this is fine (CoreDNS listens on cluster IPs only);
# stop systemd-resolved's stub listener on the node first.
hostNetwork: false

# Container port for DNS when not on the host network (the Service maps 53 to it).
dnsPort: 5353

service:
  dns:
    # One Service with both UDP and TCP 53.
    type: LoadBalancer
    port: 53
    # Local keeps client source IPs (per-device filtering and the query log need them).
    # Cluster masks them behind node IPs: NOTES.txt warns.
    externalTrafficPolicy: Local
    loadBalancerIP: ""
    loadBalancerClass: ""
    # e.g. metallb.universe.tf/loadBalancerIPs, io.cilium/lb-ipam-ips, kube-vip.io/loadbalancerIPs
    annotations: {}
    # REQ: OPS-003 (T6.14) — one address for everything: the DNS Service also carries the UI/API
    # port and (scaled) the cluster port. Only the controller has those ports, so only it gets
    # that traffic. Use this instead of giving the api or cluster Service the DNS Service's IP:
    # with externalTrafficPolicy Local, MetalLB and Cilium share an IP only between Services
    # that select the same pods, and in `mode: scaled` they don't (the DNS Service would lose
    # its IP). See docs/running.md, "Scaling in Kubernetes".
    alsoServe:
      api: false
      cluster: false
  api:
    # The web UI and REST API. ClusterIP plus `ingress`, or LoadBalancer on the LAN.
    type: ClusterIP
    port: 8053
    externalTrafficPolicy: Local
    loadBalancerIP: ""
    annotations: {}
  metrics:
    port: 9153

# REQ: DNS-002/003 — encrypted DNS for devices: DNS over TLS (853) and DNS over HTTPS (443)
# on the same DNS Service. Needs a certificate: an existing kubernetes.io/tls Secret, or one
# from cert-manager. A wildcard name (*.dns.example.com) lets devices identify themselves
# (kids-tablet.dns.example.com → client ID "kids-tablet"). The certificate is re-read when
# cert-manager renews it; no restart.
encrypted:
  dot:
    enabled: false
    port: 853
  doh:
    enabled: false
    port: 443
    path: /dns-query
    # REQ: DNS-004 — also serve DoH over HTTP/3 (QUIC, UDP on the same port); HTTP/2 answers
    # advertise it with Alt-Svc.
    http3: false
  # REQ: DNS-004 — DNS over QUIC (RFC 9250) on UDP 853: Android and iOS apps and some
  # resolvers prefer it. Uses the same certificate.
  doq:
    enabled: false
    port: 853
  # REQ: DNS-020 — accept PROXY protocol v2 on TCP, DoT, and DoH (only when a balancer in
  # front sends it: every connection must then start with the header).
  proxyProtocol: false
  tls:
    # An existing Secret with tls.crt and tls.key. Ignored when certManager.enabled.
    secretName: ""
    certManager:
      enabled: false
      issuerRef:
        name: ""
        kind: ClusterIssuer
      # e.g. [dns.example.com, "*.dns.example.com"]
      dnsNames: []

# The UI and API behind an Ingress (TLS). Also set [api] trusted_proxies in `config` to the
# ingress's source network so sign-in lockouts and the audit log see client addresses.
ingress:
  enabled: false
  className: ""
  host: ""
  # e.g. with cert-manager: {cert-manager.io/cluster-issuer: letsencrypt}
  annotations: {}
  tls:
    secretName: ""

persistence:
  # Filter snapshots, downloaded lists, the query log, rollups, users (state.db).
  enabled: true
  size: 2Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]
  # Use this PersistentVolumeClaim instead of creating one (size, storageClass, and
  # accessModes are then ignored): for moving an existing install's data to this chart.
  existingClaim: ""

resources:
  requests:
    cpu: 100m
    memory: 96Mi
  limits:
    cpu: "2"
    # Steady state ~35 MiB with typical lists; compiling large lists peaks near 110 MiB.
    memory: 512Mi

auth:
  # Create the first admin from a Secret instead of the setup token. Keys: `username` and
  # `password` or `password-hash` (an Argon2id hash from `telltale auth hash-password`).
  bootstrapAdmin:
    existingSecret: ""
    usernameKey: username
    passwordKey: password
    passwordHashKey: password-hash

# Secrets mounted read-only at /etc/telltale-secrets/<name>, e.g. an OIDC client secret
# (point client_secret_file at /etc/telltale-secrets/oidc/client_secret). `optional: true`
# lets the pod start without the Secret.
secretMounts: []
#  - name: oidc
#    secretName: telltale-oidc
#    optional: true

extraEnv: []

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# Default alerts: down, upstreams down, SERVFAIL rate, stale lists, dropped telemetry.
prometheusRule:
  enabled: false
  labels: {}
  # REQ: OBS-016 (ADR-105) — SLO recording rules (telltale:slo_*_errors:ratio_rate<window>)
  # and multi-window burn-rate alerts over every node. Keep these equal to the nodes' [slo]
  # settings, which the web UI and the API use; latencyMs must be a bucket bound of
  # telltale_query_duration_seconds (1, 5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000).
  slo:
    enabled: true
    availabilityTarget: 99.9
    latencyTarget: 99
    latencyMs: 250

# The Grafana dashboard as a ConfigMap for the Grafana sidecar.
grafanaDashboard:
  enabled: false
  labels:
    grafana_dashboard: "1"
  annotations: {}

networkPolicy:
  enabled: false
  # CIDRs allowed to query DNS / reach the UI+API / scrape metrics. Empty: anyone.
  dnsFrom: []
  apiFrom: []
  metricsFrom: []

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
# Draining: readiness turns off first, then TCP and in-flight upstream queries finish.
terminationGracePeriodSeconds: 30
# REQ: OPS-007 — on shutdown, pods keep answering this long after turning not ready, so the
# Service stops sending them queries first (no lost lookups during rollouts). Keep it well
# under terminationGracePeriodSeconds.
drainDelaySeconds: 5

podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
