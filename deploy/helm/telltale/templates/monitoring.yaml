{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "telltale.fullname" . }}
  labels:
    {{- include "telltale.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "telltale.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/part: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
---
{{- end }}
{{- if .Values.prometheusRule.enabled }}
# REQ: OBS-005, spec/06 §8 — default alerts on the exported metrics.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "telltale.fullname" . }}
  labels:
    {{- include "telltale.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: telltale
      rules:
        - alert: TelltaleDNSDown
          expr: up{job="{{ include "telltale.fullname" . }}-metrics"} == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: TelltaleDNS {{ "{{" }} $labels.instance {{ "}}" }} is not being scraped (down or unreachable).
        - alert: TelltaleDNSAllUpstreamsDown
          expr: min by (instance) (telltale_upstream_breaker_state{job="{{ include "telltale.fullname" . }}-metrics"}) == 2
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: Every upstream's circuit breaker is open on {{ "{{" }} $labels.instance {{ "}}" }}; only cached and local answers work.
        - alert: TelltaleDNSHighServfail
          expr: |
            sum by (instance) (rate(telltale_responses_total{job="{{ include "telltale.fullname" . }}-metrics", rcode="SERVFAIL"}[5m]))
              / sum by (instance) (rate(telltale_responses_total{job="{{ include "telltale.fullname" . }}-metrics"}[5m])) > 0.05
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: More than 5% of answers are SERVFAIL on {{ "{{" }} $labels.instance {{ "}}" }}.
        - alert: TelltaleDNSListStale
          expr: time() - telltale_list_last_success_timestamp_seconds{job="{{ include "telltale.fullname" . }}-metrics"} > 172800
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: Filter list {{ "{{" }} $labels.list {{ "}}" }} hasn't refreshed in over 48 hours.
        - alert: TelltaleDNSTelemetryDropping
          expr: sum by (instance) (rate(telltale_telemetry_dropped_total{job="{{ include "telltale.fullname" . }}-metrics"}[10m])) > 0
          for: 30m
          labels: { severity: info }
          annotations:
            summary: Analytics are dropping events on {{ "{{" }} $labels.instance {{ "}}" }} (answers are unaffected); raise [telemetry] ring_slots.
        - alert: TelltaleDNSClientIPsMasked
          expr: telltale_client_ips_masked{job="{{ include "telltale.fullname" . }}-metrics"} == 1
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "Most queries on {{ "{{" }} $labels.instance {{ "}}" }} come from infrastructure addresses, so per-device analytics and rules can't tell devices apart (see docs: Seeing real client IPs)."
        - alert: TelltaleDNSDeviceAnomaly
          expr: sum by (instance, kind) (increase(telltale_anomalies_total{job="{{ include "telltale.fullname" . }}-metrics"}[1h])) > 0
          labels: { severity: info }
          annotations:
            summary: A device on {{ "{{" }} $labels.instance {{ "}}" }} behaves unusually ({{ "{{" }} $labels.kind {{ "}}" }}); see Anomalies in the web UI for the evidence.
        # REQ: CLU-008 — cluster health (only emitted by clustered nodes).
        - alert: TelltaleDNSClusterPeerDown
          expr: telltale_cluster_peer_up{job="{{ include "telltale.fullname" . }}-metrics"} == 0
          for: 1m
          labels: { severity: warning }
          annotations:
            summary: Cluster node {{ "{{" }} $labels.node {{ "}}" }} ({{ "{{" }} $labels.site {{ "}}" }}) hasn't been heard from for over a minute; DNS on every node keeps working. See Cluster in the web UI.
        - alert: TelltaleDNSClusterConfigBehind
          expr: telltale_cluster_behind_seconds{job="{{ include "telltale.fullname" . }}-metrics"} > 30
          for: 1m
          labels: { severity: warning }
          annotations:
            summary: "{{ "{{" }} $labels.instance {{ "}}" }} is serving an older configuration than the primary (behind {{ "{{" }} $value {{ "}}" }} s); see Cluster → events."
        - alert: TelltaleDNSClusterSyncFailing
          expr: telltale_cluster_sync_error{job="{{ include "telltale.fullname" . }}-metrics"} == 1
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: Replication keeps failing on {{ "{{" }} $labels.instance {{ "}}" }} (it serves its last version meanwhile); the Cluster page shows the error.
        - alert: TelltaleDNSClusterCertExpiring
          expr: telltale_cluster_cert_expiry_timestamp_seconds{job="{{ include "telltale.fullname" . }}-metrics"} - time() < 14 * 86400
          for: 1h
          labels: { severity: warning }
          annotations:
            summary: The cluster certificate on {{ "{{" }} $labels.instance {{ "}}" }} expires in under 14 days.
        # REQ: CLU-003 (ADR-049) — the Git configuration source.
        - alert: TelltaleDNSGitCommitRefused
          expr: telltale_cluster_git_refused{job="{{ include "telltale.fullname" . }}-metrics"} == 1
          for: 1m
          labels: { severity: warning }
          annotations:
            summary: "The newest Git commit was refused (invalid, unsigned, or rewound); the cluster stays on the last good commit. The Cluster page shows why."
        - alert: TelltaleDNSGitSourceFailing
          expr: telltale_cluster_git_failing{job="{{ include "telltale.fullname" . }}-metrics"} == 1
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "The Git configuration source has been unreachable for 15 minutes; every node keeps serving the last commit."
        # REQ: CLU-008 (T6.11) — the machine a node runs on. Same thresholds as the Cluster page.
        - alert: TelltaleDNSDataDiskLow
          expr: telltale_data_filesystem_bytes{job="{{ include "telltale.fullname" . }}-metrics",kind="free"} / ignoring(kind) telltale_data_filesystem_bytes{job="{{ include "telltale.fullname" . }}-metrics",kind="total"} < 0.10
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Under 10% free on {{ "{{" }} $labels.instance {{ "}}" }}'s data disk; when it fills, the query log stops recording (DNS keeps answering). Shorten [telemetry.qlog] retention or add space."
        - alert: TelltaleDNSMemoryPressure
          expr: telltale_cgroup_memory_bytes{job="{{ include "telltale.fullname" . }}-metrics",kind="current"} / ignoring(kind) telltale_cgroup_memory_bytes{job="{{ include "telltale.fullname" . }}-metrics",kind="limit"} > 0.90
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "{{ "{{" }} $labels.instance {{ "}}" }} uses over 90% of its memory limit; a list compile could get it killed. Raise resources.limits.memory or use fewer lists."
        - alert: TelltaleDNSOutOfMemoryKill
          expr: increase(telltale_cgroup_oom_kills_total{job="{{ include "telltale.fullname" . }}-metrics"}[1h]) > 0
          labels: { severity: warning }
          annotations:
            summary: "The kernel killed a process in {{ "{{" }} $labels.instance {{ "}}" }}'s container for lack of memory in the last hour."
        - alert: TelltaleDNSCpuThrottled
          expr: telltale_cgroup_throttled_ratio{job="{{ include "telltale.fullname" . }}-metrics"} > 0.25
          for: 15m
          labels: { severity: info }
          annotations:
            summary: "{{ "{{" }} $labels.instance {{ "}}" }} is throttled by its CPU limit in over 25% of periods; answers may slow down. Raise resources.limits.cpu."
        - alert: TelltaleDNSRunningHot
          expr: telltale_host_temperature_celsius{job="{{ include "telltale.fullname" . }}-metrics"} >= 80
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "{{ "{{" }} $labels.instance {{ "}}" }} has been at 80 °C or more for 10 minutes; check its cooling."
---
{{- end }}
{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "telltale.fullname" . }}-dashboard
  labels:
    {{- include "telltale.labels" . | nindent 4 }}
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafanaDashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  telltale-dashboard.json: |-
{{ .Files.Get "files/telltale-dashboard.json" | indent 4 }}
{{- end }}
