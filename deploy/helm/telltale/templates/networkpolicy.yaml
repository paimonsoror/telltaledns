{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
# REQ: OPS-002, spec/08 §3.3 — only the listed networks may query, reach the UI/API, or
# scrape; egress stays open (upstreams, list downloads, sign-in providers).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "telltale.fullname" . }}
  labels:
    {{- include "telltale.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- if include "telltale.scaled" . }}
      {{- include "telltale.podLabels" . | nindent 6 }}
      {{- else }}
      {{- include "telltale.selectorLabels" . | nindent 6 }}
      {{- end }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: dns-udp, protocol: UDP }
        - { port: dns-tcp, protocol: TCP }
        {{- if .Values.encrypted.dot.enabled }}
        - { port: dns-dot, protocol: TCP }
        {{- end }}
        {{- if .Values.encrypted.doh.enabled }}
        - { port: dns-doh, protocol: TCP }
        {{- end }}
      {{- with $np.dnsFrom }}
      from:
        {{- range . }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
      {{- end }}
    - ports:
        - { port: api, protocol: TCP }
      {{- with $np.apiFrom }}
      from:
        {{- range . }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
      {{- end }}
    {{- if include "telltale.scaled" . }}
    # REQ: CLU-009 — the cluster port: resolver pods and nodes outside Kubernetes join here.
    - ports:
        - { port: cluster, protocol: TCP }
    {{- end }}
    - ports:
        - { port: metrics, protocol: TCP }
      {{- with $np.metricsFrom }}
      from:
        {{- range . }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
      {{- end }}
{{- end }}
