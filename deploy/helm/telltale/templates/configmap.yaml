{{- if ne .Values.mode "allInOne" }}
{{- fail "mode: only allInOne is available until clustering (M5)" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "telltale.fullname" . }}
  labels:
    {{- include "telltale.labels" . | nindent 4 }}
data:
  # Set by the chart (ports and paths the templates rely on).
  00-chart.toml: |
    config_version = 1

    [node]
    data_dir = "/var/lib/telltale"

    [[listen]]
    proto = "udp"
    addr = "0.0.0.0:{{ include "telltale.dnsPort" . }}"

    [[listen]]
    proto = "tcp"
    addr = "0.0.0.0:{{ include "telltale.dnsPort" . }}"
    {{- if .Values.encrypted.proxyProtocol }}
    proxy_protocol = true
    {{- end }}
    {{- $tls := printf "{ cert = \"/etc/telltale-tls/tls.crt\", key = \"/etc/telltale-tls/tls.key\" }" }}
    {{- if .Values.encrypted.dot.enabled }}

    [[listen]]
    proto = "dot"
    addr = "0.0.0.0:{{ include "telltale.dotPort" . }}"
    tls = {{ $tls }}
    proxy_protocol = {{ .Values.encrypted.proxyProtocol }}
    {{- end }}
    {{- if .Values.encrypted.doh.enabled }}

    [[listen]]
    proto = "doh"
    addr = "0.0.0.0:{{ include "telltale.dohPort" . }}"
    path = {{ .Values.encrypted.doh.path | quote }}
    tls = {{ $tls }}
    proxy_protocol = {{ .Values.encrypted.proxyProtocol }}
    {{- end }}

    [telemetry.metrics]
    listen = "0.0.0.0:{{ .Values.service.metrics.port }}"

    [api]
    listen = "0.0.0.0:{{ .Values.service.api.port }}"
  # From values.config (later files override earlier ones).
  10-values.toml: |
    {{- .Values.config | nindent 4 }}
