{{- if not (has .Values.mode (list "allInOne" "scaled")) }}
{{- fail "mode: allInOne or scaled (daemonSet comes later)" }}
{{- end }}
{{- if and (include "telltale.scaled" .) .Values.hostNetwork }}
{{- fail "mode: scaled with hostNetwork isn't supported yet: resolver pods would compete for port 53 on a node" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "telltale.fullname" . }}
  labels:
    {{- include "telltale.labels" . | nindent 4 }}
data:
  # Set by the chart (ports and paths the templates rely on).
  00-chart.toml: |
    config_version = 1

    [node]
    data_dir = "/var/lib/telltale"

    [[listen]]
    proto = "udp"
    addr = "0.0.0.0:{{ include "telltale.dnsPort" . }}"

    [[listen]]
    proto = "tcp"
    addr = "0.0.0.0:{{ include "telltale.dnsPort" . }}"
    {{- if .Values.encrypted.proxyProtocol }}
    proxy_protocol = true
    {{- end }}
    {{- $tls := printf "{ cert = \"/etc/telltale-tls/tls.crt\", key = \"/etc/telltale-tls/tls.key\" }" }}
    {{- if .Values.encrypted.dot.enabled }}

    [[listen]]
    proto = "dot"
    addr = "0.0.0.0:{{ include "telltale.dotPort" . }}"
    tls = {{ $tls }}
    proxy_protocol = {{ .Values.encrypted.proxyProtocol }}
    {{- end }}
    {{- if .Values.encrypted.doh.enabled }}

    [[listen]]
    proto = "doh"
    addr = "0.0.0.0:{{ include "telltale.dohPort" . }}"
    path = {{ .Values.encrypted.doh.path | quote }}
    tls = {{ $tls }}
    proxy_protocol = {{ .Values.encrypted.proxyProtocol }}
    {{- end }}

    [telemetry.metrics]
    listen = "0.0.0.0:{{ .Values.service.metrics.port }}"

    [api]
    listen = "0.0.0.0:{{ .Values.service.api.port }}"
  # From values.config (later files override earlier ones).
  10-values.toml: |
    {{- .Values.config | nindent 4 }}
  {{- if include "telltale.scaled" . }}
  # REQ: CLU-009 — the controller creates the cluster on first start and accepts the shared
  # bootstrap secret; resolver pods join with it as ephemeral members.
  20-controller.toml: |
    [cluster]
    site = {{ .Values.cluster.site | quote }}
    eligible = true
    listen = "0.0.0.0:{{ .Values.cluster.port }}"
    bootstrap_secret_file = "/etc/telltale-cluster/{{ .Values.cluster.bootstrapSecret.key }}"
    ephemeral_ttl_secs = {{ .Values.resolvers.ephemeralTtlSeconds }}

    [cluster.init]
    advertise = [{{ include "telltale.clusterURL" . | quote }}{{ range .Values.cluster.advertise }}, {{ . | quote }}{{ end }}]
  20-resolver.toml: |
    [cluster]
    site = {{ .Values.cluster.site | quote }}
    eligible = false
    listen = "0.0.0.0:{{ .Values.cluster.port }}"
    bootstrap_secret_file = "/etc/telltale-cluster/{{ .Values.cluster.bootstrapSecret.key }}"
    join_url = {{ include "telltale.clusterURL" . | quote }}
    ephemeral = true

    # The query log goes to the controller's volume (CLU-007).
    [telemetry]
    mode = "ship"
  {{- end }}
