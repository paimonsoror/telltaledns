{{- if not (has .Values.mode (list "allInOne" "scaled")) }}
{{- fail "mode: allInOne or scaled (daemonSet comes later)" }}
{{- end }}
{{- if and (include "telltale.scaled" .) .Values.hostNetwork }}
{{- fail "mode: scaled with hostNetwork isn't supported yet: resolver pods would compete for port 53 on a node" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "telltale.fullname" . }}
  labels:
    {{- include "telltale.labels" . | nindent 4 }}
data:
  # Set by the chart (ports and paths the templates rely on).
  00-chart.toml: |
    config_version = 1

    [node]
    data_dir = "/var/lib/telltale"

    [[listen]]
    proto = "udp"
    addr = "0.0.0.0:{{ include "telltale.dnsPort" . }}"

    [[listen]]
    proto = "tcp"
    addr = "0.0.0.0:{{ include "telltale.dnsPort" . }}"
    {{- if .Values.encrypted.proxyProtocol }}
    proxy_protocol = true
    {{- end }}
    {{- $tls := printf "{ cert = \"/etc/telltale-tls/tls.crt\", key = \"/etc/telltale-tls/tls.key\" }" }}
    {{- if .Values.encrypted.dot.enabled }}

    [[listen]]
    proto = "dot"
    addr = "0.0.0.0:{{ include "telltale.dotPort" . }}"
    tls = {{ $tls }}
    proxy_protocol = {{ .Values.encrypted.proxyProtocol }}
    {{- end }}
    {{- if .Values.encrypted.doh.enabled }}

    [[listen]]
    proto = "doh"
    addr = "0.0.0.0:{{ include "telltale.dohPort" . }}"
    path = {{ .Values.encrypted.doh.path | quote }}
    tls = {{ $tls }}
    proxy_protocol = {{ .Values.encrypted.proxyProtocol }}
    {{- end }}
    {{- if and .Values.encrypted.doh.enabled .Values.encrypted.doh.http3 }}

    [[listen]]
    proto = "doh3"
    addr = "0.0.0.0:{{ include "telltale.dohPort" . }}"
    path = {{ .Values.encrypted.doh.path | quote }}
    tls = {{ $tls }}
    {{- end }}
    {{- if .Values.encrypted.doq.enabled }}

    [[listen]]
    proto = "doq"
    addr = "0.0.0.0:{{ include "telltale.doqPort" . }}"
    tls = {{ $tls }}
    {{- end }}

    [telemetry.metrics]
    listen = "0.0.0.0:{{ .Values.service.metrics.port }}"

    [api]
    listen = "0.0.0.0:{{ .Values.service.api.port }}"
  # From values.config (later files override earlier ones).
  10-values.toml: |
    {{- .Values.config | nindent 4 }}
    {{- with .Values.kubernetes }}
    {{- if .enabled }}
    {{- $zones := list .clusterDomain }}
    {{- range list .podCidr .serviceCidr }}
    {{- with include "telltale.reverseZone" . }}{{ $zones = append $zones . }}{{ end }}
    {{- end }}

    # REQ: FLT-017 — set by the chart (kubernetes.*), in this file so its upstream and route
    # add to the ones above instead of replacing them.
    [kubernetes]
    enabled = true
    {{- with .namespaces }}
    namespaces = [{{ range $i, $n := . }}{{ if $i }}, {{ end }}{{ $n | quote }}{{ end }}]
    {{- end }}
    {{- with .excludeNamespaces }}
    exclude_namespaces = [{{ range $i, $n := . }}{{ if $i }}, {{ end }}{{ $n | quote }}{{ end }}]
    {{- end }}
    {{- with .defaultGroup }}
    default_group = {{ . | quote }}
    {{- end }}
    {{- range .map }}

    [[kubernetes.map]]
    namespace = {{ .namespace | quote }}
    {{- with .kind }}
    kind = {{ . | quote }}
    {{- end }}
    {{- with .name }}
    name = {{ . | quote }}
    {{- end }}
    group = {{ .group | quote }}
    {{- end }}

    # The cluster domain and the pod/service reverse zones go on to CoreDNS (no DNSSEC there).
    # Node-only: nodes outside this Kubernetes cluster (a Pi) can't reach CoreDNS (CLU-006).
    [[upstream]]
    name = "kubernetes-dns"
    url = {{ printf "udp://%s" (required "kubernetes.clusterDns: CoreDNS's Service address (kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.clusterIP}')" .clusterDns) | quote }}
    node_only = true

    [[upstream_group]]
    name = "kubernetes"
    members = ["kubernetes-dns"]
    strategy = "failover"
    node_only = true

    [[route]]
    match_suffix = [{{ range $i, $z := $zones }}{{ if $i }}, {{ end }}{{ $z | quote }}{{ end }}]
    upstream_group = "kubernetes"
    dnssec_nta = true
    node_only = true
    {{- end }}
    {{- end }}
  {{- if include "telltale.scaled" . }}
  # REQ: CLU-009 — the controller creates the cluster on first start and accepts the shared
  # bootstrap secret; resolver pods join with it as ephemeral members.
  20-controller.toml: |
    [cluster]
    site = {{ .Values.cluster.site | quote }}
    eligible = true
    listen = "0.0.0.0:{{ .Values.cluster.port }}"
    bootstrap_secret_file = "/etc/telltale-cluster/{{ .Values.cluster.bootstrapSecret.key }}"
    ephemeral_ttl_secs = {{ .Values.resolvers.ephemeralTtlSeconds }}

    [cluster.init]
    advertise = [{{ include "telltale.clusterURL" . | quote }}{{ range .Values.cluster.advertise }}, {{ . | quote }}{{ end }}]
    {{- with .Values.cluster.rollout }}
    {{- if .canaries }}

    # REQ: CLU-013 — staged rollouts: changes reach these nodes first.
    [cluster.rollout]
    canaries = [{{ range $i, $c := .canaries }}{{ if $i }}, {{ end }}{{ $c | quote }}{{ end }}]
    bake_secs = {{ .bakeSeconds | int }}
    servfail_pct = {{ .servfailPct | float64 }}
    require_traffic = {{ .requireTraffic }}
    history = {{ .history | int }}
    {{- end }}
    {{- end }}
  20-resolver.toml: |
    [cluster]
    site = {{ .Values.cluster.site | quote }}
    eligible = false
    listen = "0.0.0.0:{{ .Values.cluster.port }}"
    bootstrap_secret_file = "/etc/telltale-cluster/{{ .Values.cluster.bootstrapSecret.key }}"
    join_url = {{ include "telltale.clusterURL" . | quote }}
    ephemeral = true

    # The query log goes to the controller's volume (CLU-007).
    [telemetry]
    mode = "ship"
  {{- end }}
