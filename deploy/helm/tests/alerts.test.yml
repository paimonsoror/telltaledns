# REQ: CLU-008 (T6.11) — host-resource alerts, run by deploy/helm/alerts-test.sh with
# `promtool test rules` against the rules the chart renders (release "telltale").
rule_files: [rules.yml]
evaluation_interval: 1m

tests:
  # REQ: FLT-017 — the node that watches Kubernetes, 20 minutes without the API server, fires;
  # a peer with an old table (it doesn't watch) and a fresh watcher don't.
  - interval: 1m
    input_series:
      - series: 'telltale_kubernetes_table_age_seconds{job="telltale-metrics",instance="ctrl"}'
        values: "1200x20"
      - series: 'telltale_kubernetes_watching{job="telltale-metrics",instance="ctrl"}'
        values: "1x20"
      - series: 'telltale_kubernetes_table_age_seconds{job="telltale-metrics",instance="pi"}'
        values: "1200x20"
      - series: 'telltale_kubernetes_watching{job="telltale-metrics",instance="pi"}'
        values: "0x20"
      - series: 'telltale_kubernetes_table_age_seconds{job="telltale-metrics",instance="fresh"}'
        values: "30x20"
      - series: 'telltale_kubernetes_watching{job="telltale-metrics",instance="fresh"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 3m
        alertname: TelltaleDNSKubernetesWatchStale
        exp_alerts: []
      - eval_time: 10m
        alertname: TelltaleDNSKubernetesWatchStale
        exp_alerts:
          - exp_labels: { severity: warning, job: telltale-metrics, instance: ctrl }
            exp_annotations:
              summary: "ctrl hasn't heard from the Kubernetes API server for 20m 0s: new pods are named by address until it's reachable (its RBAC, or the API server). DNS answers regardless."

  # The data disk: 5% free fires after 10 minutes; 50% free on another node doesn't.
  - interval: 1m
    input_series:
      - series: 'telltale_data_filesystem_bytes{job="telltale-metrics",instance="pi",kind="free"}'
        values: "5x20"
      - series: 'telltale_data_filesystem_bytes{job="telltale-metrics",instance="pi",kind="total"}'
        values: "100x20"
      - series: 'telltale_data_filesystem_bytes{job="telltale-metrics",instance="pod",kind="free"}'
        values: "50x20"
      - series: 'telltale_data_filesystem_bytes{job="telltale-metrics",instance="pod",kind="total"}'
        values: "100x20"
    alert_rule_test:
      - eval_time: 5m
        alertname: TelltaleDNSDataDiskLow
        exp_alerts: []
      - eval_time: 15m
        alertname: TelltaleDNSDataDiskLow
        exp_alerts:
          - exp_labels: { severity: warning, job: telltale-metrics, instance: pi }
            exp_annotations:
              summary: "Under 10% free on pi's data disk; when it fills, the query log stops recording (DNS keeps answering). Shorten [telemetry.qlog] retention or add space."

  # Memory: 95% of the container limit fires; 50% doesn't.
  - interval: 1m
    input_series:
      - series: 'telltale_cgroup_memory_bytes{job="telltale-metrics",instance="pod",kind="current"}'
        values: "95x20"
      - series: 'telltale_cgroup_memory_bytes{job="telltale-metrics",instance="pod",kind="limit"}'
        values: "100x20"
      - series: 'telltale_cgroup_memory_bytes{job="telltale-metrics",instance="calm",kind="current"}'
        values: "50x20"
      - series: 'telltale_cgroup_memory_bytes{job="telltale-metrics",instance="calm",kind="limit"}'
        values: "100x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: TelltaleDNSMemoryPressure
        exp_alerts:
          - exp_labels: { severity: warning, job: telltale-metrics, instance: pod }
            exp_annotations:
              summary: "pod uses over 90% of its memory limit; a list compile could get it killed. Raise resources.limits.memory or use fewer lists."

  # An OOM kill within the hour fires at once; a steady counter doesn't.
  - interval: 1m
    input_series:
      - series: 'telltale_cgroup_oom_kills_total{job="telltale-metrics",instance="pod"}'
        values: "0x10 1x10"
      - series: 'telltale_cgroup_oom_kills_total{job="telltale-metrics",instance="calm"}'
        values: "3x20"
    alert_rule_test:
      - eval_time: 5m
        alertname: TelltaleDNSOutOfMemoryKill
        exp_alerts: []
      - eval_time: 15m
        alertname: TelltaleDNSOutOfMemoryKill
        exp_alerts:
          - exp_labels: { severity: warning, job: telltale-metrics, instance: pod }
            exp_annotations:
              summary: "The kernel killed a process in pod's container for lack of memory in the last hour."

  # Throttling over 25% for 15 minutes; heat at 80 °C for 10 minutes.
  - interval: 1m
    input_series:
      - series: 'telltale_cgroup_throttled_ratio{job="telltale-metrics",instance="pod"}'
        values: "0.4x30"
      - series: 'telltale_host_temperature_celsius{job="telltale-metrics",instance="pi"}'
        values: "82x30"
      - series: 'telltale_host_temperature_celsius{job="telltale-metrics",instance="cool"}'
        values: "55x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: TelltaleDNSCpuThrottled
        exp_alerts:
          - exp_labels: { severity: info, job: telltale-metrics, instance: pod }
            exp_annotations:
              summary: "pod is throttled by its CPU limit in over 25% of periods; answers may slow down. Raise resources.limits.cpu."
      - eval_time: 20m
        alertname: TelltaleDNSRunningHot
        exp_alerts:
          - exp_labels: { severity: warning, job: telltale-metrics, instance: pi }
            exp_annotations:
              summary: "pi has been at 80 °C or more for 10 minutes; check its cooling."

  # REQ: OBS-016 (T11.1) — SLO burn rates over every node: 3% SERVFAIL for an hour burns a
  # 99.9% budget 30x (fast); 30% slow answers burn a 99% latency budget 30x. Before the hour's
  # bad answers reach 10, nothing fires.
  - interval: 1m
    input_series:
      - series: 'telltale_responses_total{job="telltale-metrics",instance="pi",rcode="NOERROR"}'
        values: "0+485x70"
      - series: 'telltale_responses_total{job="telltale-metrics",instance="pod",rcode="NOERROR"}'
        values: "0+485x70"
      - series: 'telltale_responses_total{job="telltale-metrics",instance="pod",rcode="SERVFAIL"}'
        values: "0+30x70"
      - series: 'telltale_query_duration_seconds_count{job="telltale-metrics",instance="pod",path="upstream"}'
        values: "0+1000x70"
      - series: 'telltale_query_duration_seconds_bucket{job="telltale-metrics",instance="pod",path="upstream",le="0.25"}'
        values: "0+700x70"
    alert_rule_test:
      - eval_time: 65m
        alertname: TelltaleDNSSLOAvailabilityBurnFast
        exp_alerts:
          - exp_labels: { severity: critical, slo: availability }
            exp_annotations:
              summary: "The availability objective (99.9%) is spending its error budget over 14.4x too fast (SERVFAIL answers over the last 1h and 5m); see the dashboard's Service level card."
      - eval_time: 65m
        alertname: TelltaleDNSSLOLatencyBurnFast
        exp_alerts:
          - exp_labels: { severity: critical, slo: latency }
            exp_annotations:
              summary: "The latency objective (99%) is spending its error budget over 14.4x too fast (answers slower than 250 ms over the last 1h and 5m); see the dashboard's Service level card."

  # A quiet network: 5 answers a minute with a SERVFAIL every 5 minutes burns 40x, but the
  # last 5 minutes hold fewer than 50 answers, so the fast alert stays quiet (as in the web UI).
  - interval: 1m
    input_series:
      - series: 'telltale_responses_total{job="telltale-metrics",instance="pi",rcode="NOERROR"}'
        values: "0+5x70"
      - series: 'telltale_responses_total{job="telltale-metrics",instance="pi",rcode="SERVFAIL"}'
        values: "0+0.2x70"
    alert_rule_test:
      - eval_time: 65m
        alertname: TelltaleDNSSLOAvailabilityBurnFast
        exp_alerts: []

  # REQ: OBS-020 (T11.3) — a listener that stops answering its probe for 2 minutes fires; one
  # that answers doesn't. A certificate 5 days from expiry fires after an hour.
  - interval: 1m
    input_series:
      - series: 'telltale_probe_success{job="telltale-metrics",instance="pi",target="tls://127.0.0.1:853",proto="dot"}'
        values: "1x5 0x10"
      - series: 'telltale_probe_success{job="telltale-metrics",instance="pi",target="udp://127.0.0.1:53",proto="udp"}'
        values: "1x15"
      - series: 'telltale_listener_cert_expiry_timestamp_seconds{job="telltale-metrics",instance="pi",target="tls://127.0.0.1:853",proto="dot"}'
        values: "432000x90"
    alert_rule_test:
      - eval_time: 6m
        alertname: TelltaleDNSListenerNotAnswering
        exp_alerts: []
      - eval_time: 10m
        alertname: TelltaleDNSListenerNotAnswering
        exp_alerts:
          - exp_labels: { severity: critical, job: telltale-metrics, instance: pi, target: "tls://127.0.0.1:853", proto: dot }
            exp_annotations:
              summary: "pi can't get an answer from tls://127.0.0.1:853 (dot) through its own probe; see Settings → System → Listener checks."
      - eval_time: 70m
        alertname: TelltaleDNSListenerCertExpiring
        exp_alerts:
          - exp_labels: { severity: warning, job: telltale-metrics, instance: pi, target: "tls://127.0.0.1:853", proto: dot }
            exp_annotations:
              summary: "The certificate of tls://127.0.0.1:853 on pi expires in under 14 days; DoT/DoH/DoQ clients stop connecting when it does."

  # REQ: CLU-013 (T13.2) — a failed rollout alerts once (for 15 minutes after the failure); a
  # pin alerts after an hour and stops when unpinned.
  - interval: 1m
    input_series:
      - series: 'telltale_cluster_rollouts_total{job="telltale-metrics",instance="ctl",outcome="failed"}'
        values: "0x10 1x60"
      - series: 'telltale_cluster_pinned{job="telltale-metrics",instance="ctl"}'
        values: "0x10 1x80 0x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: TelltaleDNSRolloutFailed
        exp_alerts: []
      - eval_time: 15m
        alertname: TelltaleDNSRolloutFailed
        exp_alerts:
          - exp_labels: { severity: warning, job: telltale-metrics, instance: ctl, outcome: failed }
            exp_annotations:
              summary: "A staged rollout failed its guard (ctl): the cluster is pinned to the version before it. The Cluster page shows the reason; unpin once the change is fixed."
      - eval_time: 40m
        alertname: TelltaleDNSRolloutFailed
        exp_alerts: []
      - eval_time: 40m
        alertname: TelltaleDNSClusterPinned
        exp_alerts: []
      - eval_time: 75m
        alertname: TelltaleDNSClusterPinned
        exp_alerts:
          - exp_labels: { severity: warning, job: telltale-metrics, instance: ctl }
            exp_annotations:
              summary: "The cluster has been pinned to an older version for over an hour, so configuration changes wait. The Cluster page says why and what the pin holds back."
      - eval_time: 95m
        alertname: TelltaleDNSClusterPinned
        exp_alerts: []

  # REQ: OPS-010 (T13.4) — a node in maintenance stays quiet, even once it stops reporting (its
  # last window, until 3600 s, is still open); others alert as usual; when the window ends, it
  # alerts again. The same for a peer the cluster reports down.
  - interval: 1m
    input_series:
      - series: 'up{job="telltale-metrics",instance="pi"}'
        values: "0x90"
      - series: 'telltale_node_maintenance_until_seconds{job="telltale-metrics",instance="pi"}'
        values: "3600x4 _x86"
      - series: 'telltale_data_filesystem_bytes{job="telltale-metrics",instance="pi",kind="free"}'
        values: "5x90"
      - series: 'telltale_data_filesystem_bytes{job="telltale-metrics",instance="pi",kind="total"}'
        values: "100x90"
      - series: 'up{job="telltale-metrics",instance="k3s"}'
        values: "0x90"
      - series: 'telltale_node_maintenance_until_seconds{job="telltale-metrics",instance="k3s"}'
        values: "0x90"
      - series: 'telltale_cluster_peer_up{job="telltale-metrics",instance="k3s",node="b2",site="pi"}'
        values: "0x90"
      - series: 'telltale_cluster_peer_maintenance_until_seconds{job="telltale-metrics",instance="k3s",node="b2",site="pi"}'
        values: "3600x90"
      - series: 'telltale_cluster_peer_up{job="telltale-metrics",instance="k3s",node="c3",site="lab"}'
        values: "0x90"
      - series: 'telltale_cluster_peer_maintenance_until_seconds{job="telltale-metrics",instance="k3s",node="c3",site="lab"}'
        values: "0x90"
    alert_rule_test:
      - eval_time: 15m
        alertname: TelltaleDNSDown
        exp_alerts:
          - exp_labels: { severity: critical, job: telltale-metrics, instance: k3s }
            exp_annotations:
              summary: TelltaleDNS k3s is not being scraped (down or unreachable).
      - eval_time: 15m
        alertname: TelltaleDNSDataDiskLow
        exp_alerts: []
      - eval_time: 15m
        alertname: TelltaleDNSClusterPeerDown
        exp_alerts:
          - exp_labels: { severity: warning, job: telltale-metrics, instance: k3s, node: c3, site: lab }
            exp_annotations:
              summary: Cluster node c3 (lab) hasn't been heard from for over a minute; DNS on every node keeps working. See Cluster in the web UI.
      - eval_time: 70m
        alertname: TelltaleDNSDown
        exp_alerts:
          - exp_labels: { severity: critical, job: telltale-metrics, instance: k3s }
            exp_annotations:
              summary: TelltaleDNS k3s is not being scraped (down or unreachable).
          - exp_labels: { severity: critical, job: telltale-metrics, instance: pi }
            exp_annotations:
              summary: TelltaleDNS pi is not being scraped (down or unreachable).
      - eval_time: 70m
        alertname: TelltaleDNSClusterPeerDown
        exp_alerts:
          - exp_labels: { severity: warning, job: telltale-metrics, instance: k3s, node: b2, site: pi }
            exp_annotations:
              summary: Cluster node b2 (pi) hasn't been heard from for over a minute; DNS on every node keeps working. See Cluster in the web UI.
          - exp_labels: { severity: warning, job: telltale-metrics, instance: k3s, node: c3, site: lab }
            exp_annotations:
              summary: Cluster node c3 (lab) hasn't been heard from for over a minute; DNS on every node keeps working. See Cluster in the web UI.

  # REQ: FLT-004 — TelltaleDNSListStale means "the last success is over 48 hours ago AND the latest
  # refresh failed" (not literally "failing for over 48 hours"). A list in that state fires; a list
  # disabled at runtime (its last success frozen) and a weekly list between refreshes are just as
  # old but not failing, and don't.
  # promtool's clock starts at 0, so "a success 200000 s ago" is a negative sample value: the age
  # at time t is t + 200000 s, over the 172800 s limit from the first minute. The alert is
  # therefore pending from minute 0 and fires 30 minutes later (`for: 30m`). The 10m assertion
  # covers only that `for:` (the old rule passes it too); the 45m one tells the lists apart.
  - interval: 1m
    input_series:
      - series: 'telltale_list_last_success_timestamp_seconds{job="telltale-metrics",instance="pi",list="broken"}'
        values: "-200000x60"
      - series: 'telltale_list_fetch_consecutive_failures{job="telltale-metrics",instance="pi",list="broken"}'
        values: "40x60"
      - series: 'telltale_list_last_success_timestamp_seconds{job="telltale-metrics",instance="pi",list="disabled"}'
        values: "-200000x60"
      - series: 'telltale_list_fetch_consecutive_failures{job="telltale-metrics",instance="pi",list="disabled"}'
        values: "0x60"
      - series: 'telltale_list_last_success_timestamp_seconds{job="telltale-metrics",instance="pi",list="weekly"}'
        values: "-500000x60"
      - series: 'telltale_list_fetch_consecutive_failures{job="telltale-metrics",instance="pi",list="weekly"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 10m
        alertname: TelltaleDNSListStale
        exp_alerts: []
      - eval_time: 45m
        alertname: TelltaleDNSListStale
        exp_alerts:
          - exp_labels: { severity: warning, job: telltale-metrics, instance: pi, list: broken }
            exp_annotations:
              summary: Filter list broken hasn't refreshed in over 48 hours and its latest refresh failed (the last good copy is still in use).

  # REQ: FLT-004 — failing, but the last good copy is under 48 hours old ("recent": 100000 s):
  # not yet. A list that never succeeded ("never") has no last-success series at all, so the rule
  # can't match it: a known gap, pinned on purpose (the in-app `list_failing` rule reports it; if
  # the chart ever covers it, change this case). "broken" is the control: it proves the series
  # are wired, so an empty result for the others isn't a typo.
  - interval: 1m
    input_series:
      - series: 'telltale_list_last_success_timestamp_seconds{job="telltale-metrics",instance="pi",list="broken"}'
        values: "-200000x60"
      - series: 'telltale_list_fetch_consecutive_failures{job="telltale-metrics",instance="pi",list="broken"}'
        values: "40x60"
      - series: 'telltale_list_last_success_timestamp_seconds{job="telltale-metrics",instance="pi",list="recent"}'
        values: "-100000x60"
      - series: 'telltale_list_fetch_consecutive_failures{job="telltale-metrics",instance="pi",list="recent"}'
        values: "3x60"
      - series: 'telltale_list_fetch_consecutive_failures{job="telltale-metrics",instance="pi",list="never"}'
        values: "40x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: TelltaleDNSListStale
        exp_alerts:
          - exp_labels: { severity: warning, job: telltale-metrics, instance: pi, list: broken }
            exp_annotations:
              summary: Filter list broken hasn't refreshed in over 48 hours and its latest refresh failed (the last good copy is still in use).

  # REQ: FLT-004, ADR-147 — a list held by `max_shrink_percent` keeps its old last success and
  # isn't a failure (its failure count stays 0): the same series as the healthy old lists above,
  # pinned on its own because it is a different situation. The chart alert stays silent for it
  # (the old rule fired); the in-app `list_failing` rule reports a held list.
  - interval: 1m
    input_series:
      - series: 'telltale_list_last_success_timestamp_seconds{job="telltale-metrics",instance="pi",list="broken"}'
        values: "-200000x60"
      - series: 'telltale_list_fetch_consecutive_failures{job="telltale-metrics",instance="pi",list="broken"}'
        values: "40x60"
      - series: 'telltale_list_last_success_timestamp_seconds{job="telltale-metrics",instance="pi",list="held"}'
        values: "-300000x60"
      - series: 'telltale_list_fetch_consecutive_failures{job="telltale-metrics",instance="pi",list="held"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: TelltaleDNSListStale
        exp_alerts:
          - exp_labels: { severity: warning, job: telltale-metrics, instance: pi, list: broken }
            exp_annotations:
              summary: Filter list broken hasn't refreshed in over 48 hours and its latest refresh failed (the last good copy is still in use).

  # REQ: FLT-004 — the join is on (instance, list): the same list name on two instances, only
  # one of them failing, fires only that instance. Joining on `list` alone would let the failing
  # instance's series make the healthy one fire too; joining on `instance` alone would make every
  # old list on a node with one failing list fire.
  - interval: 1m
    input_series:
      - series: 'telltale_list_last_success_timestamp_seconds{job="telltale-metrics",instance="pi",list="ads"}'
        values: "-200000x60"
      - series: 'telltale_list_fetch_consecutive_failures{job="telltale-metrics",instance="pi",list="ads"}'
        values: "40x60"
      - series: 'telltale_list_last_success_timestamp_seconds{job="telltale-metrics",instance="k3s",list="ads"}'
        values: "-200000x60"
      - series: 'telltale_list_fetch_consecutive_failures{job="telltale-metrics",instance="k3s",list="ads"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: TelltaleDNSListStale
        exp_alerts:
          - exp_labels: { severity: warning, job: telltale-metrics, instance: pi, list: ads }
            exp_annotations:
              summary: Filter list ads hasn't refreshed in over 48 hours and its latest refresh failed (the last good copy is still in use).
